<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.jsdelivr.net/npm/vue@2.7.16/dist/vue.js"></script>
</head>
<style>
    * {
        padding: 0;
        margin: 0;
    }

    #box {
        margin: 100px auto;
        display: flex;
        justify-content: center;
    }

    button {
        height: 25px;
        width: 25px;
    }

    span {
        height: 25px;
        width: 25px;
        margin: 0 10px;
    }
    #app{
        margin: 0 auto;
        display: flex;
        flex-direction: column;
        align-items: center;
    }
    .toggle {
        margin: 10px auto;
        height: 30px;
        width: 100px;
    }
</style>

<body>
    <div id="box">
        <!-- v-on:事件="内联语句" -->
        <!-- @事件="内联语句" -->
        <button v-on:click="count--">-</button>
        <span>{{ count }}</span>
        <button v-on:click='count++'>+</button>
    </div>
    <div id="app">
        <!-- v-on:事件="methods中的函数名" -->
        <!-- @事件="methods中的函数名" -->
        <button @click="fn" class="toggle">切换显示隐藏</button>
        <h2 v-show="isShow">Hello</h2>
    </div>
    <script>
        const box = new Vue({
            el: '#box',
            data: {
                count: 99,
            },
        })
        const app = new Vue({
            el: "#app",
            data: {
                isShow: true,
            },
            methods: {
                fn() {
                    //不能直接拿到数据 要用实例/this
                    // 提供的所有methods中的函数,this都指向当前实例
                    console.log(this === app)
                    this.isShow = !this.isShow 
                }
            },
        })
    </script>
</body>

</html>
