<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vue 测试</title>
</head>

<body>
    <div id="box">{{ t }}
        <div v-html="msg"></div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/vue@2.7.16/dist/vue.js"></script>
    <script>
        new Vue({
            el: '#box',
            data: {
                t: 'Hello Vue',
                msg: `<a href="http://itheima.com">heima</a>`,
            }
        })
    </script>
</body>

</html>
