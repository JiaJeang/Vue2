<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.jsdelivr.net/npm/vue@2.7.16/dist/vue.js"></script>
    <style>
        * {
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }

        #app {
            margin: 100px auto;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .progress {
            width: 520px;
            height: 25px;
            border-radius: 25px;
            padding: 3px;
            background-color: black;
        }

        .inner {
            width: 0%;
            height: 100%;
            border-radius: 25px;
            background-color: rgb(45, 130, 241);
            transition: all .3s;
        }

        span {
            margin-top: 20px;
            font-size: 28px;
            font-weight: 700;
        }

        button {
            border: 0px;
            margin-top: 20px;
            width: 100px;
            height: 30px;
            border-radius: 10px;
            font-size: 18px;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <div id="app">
        <div class="progress">
            <div class="inner" :style="{width:pos+'%'}"></div>
        </div>
        <span v-html="msg"></span>
        <button @click="sta">start</button>
    </div>
    <script>
        const app = new Vue({
            el: '#app',
            data: {
                pos: 0,
                timer: null
            },
            computed: {
                msg() {
                    return `${this.pos}%`;
                }
            },
            methods: {
                sta() {
                    clearInterval(this.timer);
                    this.timer = setInterval(() => {
                        if (this.pos >= 100) {
                            clearInterval(this.timer); 
                            return;
                        }
                        this.pos += 1; 
                    }, 100);
                }
            },
        })
    </script>
</body>

</html>
