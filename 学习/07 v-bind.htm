<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.jsdelivr.net/npm/vue@2.7.16/dist/vue.js"></script>
</head>
<style>
    *{
        margin: 0;
        padding: 0;
    }
    #box{
        margin: 100px auto;
        width: 600px;
        height: 500px;
    }
    img{
        width: 100%;
        height: 100%;
    }
</style>
<body>
    <div id="box">
        <!-- v-bind : 动态设置html的标签属性(sec,url,title...) -->
        <!-- v-bind:属性名="表达式" -->

        <!-- <img v-bind:src="imgurl" v-bind:title="msg" v-bind:alt=""> -->
        <!-- 简写: v-bind:src <==> :src -->
        <img :src="imgurl" :title="msg" :alt="alt">
    </div>
    <script>
        const box=new Vue({
            el:"#box",
            data:{
                imgurl:'./imgs/1.jpg',
                msg:"img",
                alt:"",
            }
        })
    </script>
</body>
</html>
