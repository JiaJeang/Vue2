<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.jsdelivr.net/npm/vue@2.7.16/dist/vue.js"></script>
</head>
<style>
    *{
        padding: 0;
        margin: 0;
    }
    .box{
        height: 100px;
        width: 200px;
        border: 5px solid #000;
        border-radius: 5px;
        margin: 20px;
        line-height: 100px;
        text-align: center;
    }
</style>
<body>
    <div id="box">
        <!-- 
        v-show 通过切换css:display:none 隐藏 -> 用于频繁切换场景
        v-fi 根据判断条件控制元素的创建和隐藏(条件渲染) 
        -->
        <div v-show="flag" class="box">v-show box</div>
        <div v-if="flag" class="box">v-if box</div>
    </div>
</body>
<script>
    const box=new Vue({
        el:"#box",
        data:{
            flag:true,
        }
    })
</script>
</html>
